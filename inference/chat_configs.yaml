chat_history:
  db_path: chat_history.db

model:
  load_in_4bit: true

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

memory:
  summary_threshold: 2000
  max_recent_messages: 6

summarization:
  model: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 150

system_prompt: |
  You explain concepts clearly and adapt explanations
  to the user's level (age, education, job, etc.).