chat_history:
  db_path: chat_history.db

model:
  load_in_4bit: true

generation:
  max_new_tokens: 128
  temperature: 0.7

memory:
  summary_threshold: 2000
  max_recent_messages: 6

summarization:
  model: Qwen/Qwen2.5-7B-Instruct #Qwen/Qwen3-4B-Instruct-2507
  max_new_tokens: 150

system_prompt: |
  You explain concepts clearly and adapt explanations
  to the user's level (age, education, job, etc.).